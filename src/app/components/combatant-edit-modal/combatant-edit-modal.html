<div class="overlay" (click)="close.emit()">
    <section
        class="modal combatant-edit-modal compact-form-modal"
        appModalFocusTrap
        (click)="$event.stopPropagation()"
    >
        <header class="modal-header">
            <div>
                <p>{{ 'combatantEdit.subtitle' | translate }}</p>
                <h2>{{ 'combatantEdit.title' | translate }}</h2>
            </div>

            <button
                class="close-btn"
                type="button"
                (click)="close.emit()"
                [title]="'common.close' | translate"
            >
                <lucide-icon [img]="XIcon" [size]="16"></lucide-icon>
            </button>
        </header>

        <div class="edit-grid">
            <label class="full">
                <span>{{ 'combatantEdit.name' | translate }}</span>
                <input type="text" [(ngModel)]="model.name" />
            </label>

            <label>
                <span>{{ 'combatant.ac' | translate }}</span>
                <input
                    type="number"
                    min="1"
                    [(ngModel)]="model.armorClass"
                    (focus)="selectNumberValue($event)"
                />
            </label>

            <label>
                <span>{{ 'combatantEdit.currentHp' | translate }}</span>
                <input
                    type="number"
                    min="0"
                    [(ngModel)]="model.currentHp"
                    (focus)="selectNumberValue($event)"
                />
            </label>

            <label>
                <span>{{ 'combatantEdit.maxHp' | translate }}</span>
                <input
                    type="number"
                    min="1"
                    [(ngModel)]="model.maxHp"
                    (focus)="selectNumberValue($event)"
                />
            </label>

            <label>
                <span>{{ 'combatantEdit.initiative' | translate }}</span>
                <input
                    type="number"
                    [(ngModel)]="model.initiative"
                    (focus)="selectNumberValue($event)"
                />
            </label>
        </div>

        <footer class="modal-actions">
            <button type="button" class="ghost-btn" (click)="close.emit()">
                {{ 'common.cancel' | translate }}
            </button>
            <button type="button" class="primary-btn" [disabled]="!canSave" (click)="submit()">
                <lucide-icon [img]="CheckIcon" [size]="14"></lucide-icon>
                {{ 'common.save' | translate }}
            </button>
        </footer>
    </section>
</div>

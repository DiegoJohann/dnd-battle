<!-- Desktop hamburger menu -->
<button class="desktop-menu-toggle" (click)="toggleDesktopMenu()">
    <lucide-icon [img]="MenuIcon" [size]="18"></lucide-icon>
</button>

@if (desktopMenuOpen) {
    <div class="desktop-menu-overlay" (click)="closeDesktopMenu()"></div>
    <div
        class="desktop-menu theme-popover"
        animate.enter="menu-enter"
        animate.leave="menu-leave"
        (click)="$event.stopPropagation()"
    >
        <button
            class="desktop-menu-item"
            [title]="'encounter.tooltip' | translate"
            (click)="openEncounter.emit(); closeDesktopMenu()"
        >
            <lucide-icon [img]="FolderOpenIcon" [size]="16"></lucide-icon>
            <span>{{ 'encounter.open' | translate }}</span>
        </button>
        <button
            class="desktop-menu-item"
            [title]="'library.tooltip' | translate"
            (click)="openLibrary.emit(); closeDesktopMenu()"
        >
            <lucide-icon [img]="BookOpenIcon" [size]="16"></lucide-icon>
            <span>{{ 'library.open' | translate }}</span>
        </button>
        <button
            class="desktop-menu-item"
            [title]="'areaDamage.tooltip' | translate"
            [disabled]="areaDamageDisabled"
            (click)="areaDamage.emit(); closeDesktopMenu()"
        >
            <lucide-icon [img]="FlameIcon" [size]="16"></lucide-icon>
            <span>{{ 'areaDamage.shortTitle' | translate }}</span>
        </button>
        <div class="desktop-menu-divider"></div>
        <div class="desktop-menu-item desktop-lang-row">
            <span>{{ 'language.label' | translate }}</span>
            <select
                [value]="currentLanguage"
                (change)="languageChange.emit(desktopLangInput.value); closeDesktopMenu()"
                #desktopLangInput
            >
                @for (language of supportedLanguages; track language) {
                    <option [value]="language">
                        {{ 'language.options.' + language | translate }}
                    </option>
                }
            </select>
        </div>
    </div>
}

<label class="language-select">
    <span>{{ 'language.label' | translate }}</span>
    <select
        [value]="currentLanguage"
        (change)="languageChange.emit(languageInput.value)"
        #languageInput
    >
        @for (language of supportedLanguages; track language) {
            <option [value]="language">{{ 'language.options.' + language | translate }}</option>
        }
    </select>
</label>

<button class="add-btn" [class.pulse]="empty" (click)="addCombatant.emit()">
    <lucide-icon [img]="PlusIcon" [size]="18"></lucide-icon>
    <span class="label">{{ 'battle.addCombatant' | translate }}</span>
</button>

<button class="clear-btn" (click)="clearBattlefield.emit()">
    <lucide-icon [img]="Trash2Icon" [size]="14"></lucide-icon>
    {{ 'common.clear' | translate }}
</button>

<!-- Mobile hamburger menu -->
<button class="mobile-menu-toggle" [class.active]="mobileMenuOpen" (click)="toggleMobileMenu()">
    <lucide-icon [img]="MenuIcon" [size]="22"></lucide-icon>
</button>

@if (mobileMenuOpen) {
    <div class="mobile-menu-overlay" (click)="closeMobileMenu()"></div>
    <div
        class="mobile-menu theme-popover"
        animate.enter="mobile-menu-enter"
        animate.leave="mobile-menu-leave"
        (click)="$event.stopPropagation()"
    >
        <button class="mobile-menu-item" (click)="openEncounter.emit(); closeMobileMenu()">
            <lucide-icon [img]="FolderOpenIcon" [size]="18"></lucide-icon>
            <span>{{ 'encounter.open' | translate }}</span>
        </button>
        <button class="mobile-menu-item" (click)="openLibrary.emit(); closeMobileMenu()">
            <lucide-icon [img]="BookOpenIcon" [size]="18"></lucide-icon>
            <span>{{ 'library.open' | translate }}</span>
        </button>
        <button
            class="mobile-menu-item"
            [disabled]="areaDamageDisabled"
            (click)="areaDamage.emit(); closeMobileMenu()"
        >
            <lucide-icon [img]="FlameIcon" [size]="18"></lucide-icon>
            <span>{{ 'areaDamage.shortTitle' | translate }}</span>
        </button>
        <button class="mobile-menu-item" (click)="addCombatant.emit(); closeMobileMenu()">
            <lucide-icon [img]="PlusIcon" [size]="18"></lucide-icon>
            <span>{{ 'battle.addCombatant' | translate }}</span>
        </button>
        <button
            class="mobile-menu-item danger"
            (click)="clearBattlefield.emit(); closeMobileMenu()"
        >
            <lucide-icon [img]="Trash2Icon" [size]="18"></lucide-icon>
            <span>{{ 'common.clear' | translate }}</span>
        </button>
        <div class="mobile-menu-divider"></div>
        <div class="mobile-menu-item mobile-lang-row">
            <span>{{ 'language.label' | translate }}</span>
            <select
                [ngModel]="currentLanguage"
                (ngModelChange)="languageChange.emit($event); closeMobileMenu()"
                #langSelect
            >
                @for (language of supportedLanguages; track language) {
                    <option [value]="language">
                        {{ 'language.options.' + language | translate }}
                    </option>
                }
            </select>
        </div>
    </div>
}

<div class="grid">
    @for (combatant of combatants; track combatant.id) {
        <app-combatant-card
            animate.enter="combatant-card-enter"
            animate.leave="combatant-card-leave"
            [style.--combatant-enter-delay]="$index * 50 + 'ms'"
            [combatant]="combatant"
            [conditionsOpen]="openConditionsForId === combatant.id"
            [activeTurn]="activeCombatantId === combatant.id"

            (toggleConditions)="toggleConditionsPopover(combatant.id)"
            (closeConditions)="closeAllConditions()"

            (damage)="applyDamage(combatant, $event)"
            (healing)="applyHealing(combatant, $event)"
            (temporaryHpChange)="updateTemporaryHp(combatant, $event)"
            (remove)="onClickRemoveCombatant(combatant)"
            (initiativeChange)="updateInitiative(combatant, $event)"
            (armorClassChange)="updateArmorClass(combatant, $event)"
            (maxHpChange)="updateMaxHp(combatant, $event)"
            (conditionsChange)="updateConditions(combatant, $event)"
            (conditionStatesChange)="updateConditionStates(combatant, $event)"
            (openSpellSlots)="openSpellSlotsModal(combatant)"
            (spellSlotsChange)="updateSpellSlots(combatant, $event)"
        />
    }
</div>

<app-turn-tracker
    [round]="round"
    [activeCombatantName]="activeCombatant?.name"
    [hasCombatants]="!!combatants.length"
    (resetTurn)="openResetTurnModal()"
    (previousTurn)="previousTurn()"
    (nextTurn)="nextTurn()"
/>

<app-battle-toolbar
    [currentLanguage]="languageService.currentLanguage"
    [supportedLanguages]="languageService.supportedLanguages"
    [empty]="combatants.length === 0"
    [areaDamageDisabled]="!hasAliveNpcs"
    (languageChange)="changeLanguage($event)"
    (openEncounter)="openEncounterModal()"
    (areaDamage)="openAreaDamageModal()"
    (addCombatant)="openAddCombatantModal()"
    (clearBattlefield)="openClearFieldModal()"
/>

@if (showAddCombatantModal) {
    <app-add-combatant-modal
        (close)="closeAddCombatantModal()"
        (create)="addCombatants($event)"
    />
}

@if (showClearFieldModal) {
    <app-clear-battle-modal
        (clear)="clearCombatants($event)"
        (close)="closeClearFieldModal()"
    />
}

@if (showEncounterModal) {
    <app-encounter-manager-modal
        [combatants]="combatants"
        [round]="round"
        [activeCombatantId]="activeCombatantId"
        (close)="closeEncounterModal()"
        (encounterLoaded)="applyEncounterData($event)"
    />
}

@if (showResetTurnModal) {
    <app-reset-turn-modal
        (reset)="resetTurnTracker()"
        (close)="closeResetTurnModal()"
    />
}

@if (showAreaDamageModal) {
    <app-area-damage-modal
        [combatants]="combatants"
        (applyDamage)="applyAreaDamage($event)"
        (close)="closeAreaDamageModal()"
    />
}

@if (spellSlotsCombatant) {
    <app-spell-slots-modal
        [combatant]="spellSlotsCombatant"
        (close)="closeSpellSlotsModal()"
        (spellSlotsChange)="updateSpellSlots(spellSlotsCombatant, $event)"
    />
}

@if (showConfirmationDialog) {
    <app-confirmation-dialog
        confirmationMessage="battle.removeConfirmation"
        (actionConfirmed)="removeCombatant()"
        (actionRejected)="this.showConfirmationDialog = false; this.combatantToRemove = undefined;"
    ></app-confirmation-dialog>
}

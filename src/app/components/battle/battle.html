<div class="grid" [@listAnim]>
    @for (combatant of combatants; track combatant.id) {
        <app-combatant-card
            [combatant]="combatant"
            [conditionsOpen]="openConditionsForId === combatant.id"

            (toggleConditions)="toggleConditionsPopover(combatant.id)"
            (closeConditions)="closeAllConditions()"

            (damage)="applyDamage(combatant, $event)"
            (healing)="applyHealing(combatant, $event)"
            (temporaryHpChange)="updateTemporaryHp(combatant, $event)"
            (remove)="onClickRemoveCombatant(combatant)"
            (initiativeChange)="updateInitiative(combatant, $event)"
            (conditionsChange)="combatant.conditions = $event; save()"
            (openSpellSlots)="openSpellSlotsModal(combatant)"
        />
    }
</div>

<label class="language-select">
    <span>{{ 'language.label' | translate }}</span>
    <select
        [value]="languageService.currentLanguage"
        (change)="changeLanguage(languageInput.value)"
        #languageInput
    >
        @for (language of languageService.supportedLanguages; track language) {
            <option [value]="language">{{ ('language.options.' + language) | translate }}</option>
        }
    </select>
</label>

<button class="add-btn" [class.pulse]="combatants.length === 0" (click)="openAddCombatantModal()">
    <lucide-icon [img]="PlusIcon" [size]="18"></lucide-icon>
    <span class="label">{{ 'battle.addCombatant' | translate }}</span>
</button>

<button class="clear-btn" (click)="openClearFieldModal()">
    <lucide-icon [img]="Trash2Icon" [size]="14"></lucide-icon>
    {{ 'common.clear' | translate }}
</button>

@if (showAddCombatantModal) {
    <app-add-combatant-modal
        (close)="closeAddCombatantModal()"
        (create)="addCombatant($event)"
    />
}

@if (showClearFieldModal) {
    <div class="overlay">
        <div class="modal">
            <h2>{{ 'battle.clear.title' | translate }}</h2>
            <p>{{ 'battle.clear.prompt' | translate }}</p>

            <div class="actions">
                <button (click)="clearCombatants('NPC')">{{ 'battle.clear.npcs' | translate }}</button>
                <button (click)="clearCombatants('PLAYER')">{{ 'battle.clear.players' | translate }}</button>
                <button (click)="clearCombatants('ALL')">{{ 'battle.clear.all' | translate }}</button>
                <button (click)="closeClearFieldModal()">{{ 'common.cancel' | translate }}</button>
            </div>
        </div>
    </div>
}

@if (spellSlotsCombatant) {
    <app-spell-slots-modal
        [combatant]="spellSlotsCombatant"
        (close)="closeSpellSlotsModal()"
        (spellSlotsChange)="spellSlotsCombatant.spellSlots = $event; save()"
    />
}

@if (showConfirmationDialog) {
    <app-confirmation-dialog
        confirmationMessage="battle.removeConfirmation"
        (actionConfirmed)="removeCombatant()"
        (actionRejected)="this.showConfirmationDialog = false; this.combatantToRemove = undefined;"
    ></app-confirmation-dialog>
}

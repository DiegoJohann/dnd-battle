<div class="overlay">
    <div class="modal" #confirmationModal (keydown.tab)="trapModalTab($event, confirmationModal)">
        <p>{{ confirmationMessage | translate }}</p>

        <div class="actions">
            <button (click)="confirm()">{{ acceptLabel | translate }}</button>
            <button #rejectButton (click)="reject()">{{ rejectLabel | translate }}</button>
        </div>
    </div>
</div>
